# Portainer Repository mode: git source https://gitea.lengoc.me/apps/lnc-care.git, Compose path stack.yml (build: ., no image:).
# Pre-create ${DATA_DIR}/lnc-care on the Docker host, owned by uid:gid 10001:10001.
# Deployed on 10.21.4.101:8482, domain https://care-mcp.lengoc.me via FR Caddy Fleet.
services:
  lnc-care:
    build: .
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${BIND_IP:?set-approved-bind-ip}:${PORT:?set-approved-unused-port}:8000"
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Paris}
      MANAGEMENT_KEY: ${MANAGEMENT_KEY:-}
      CARE_ADMIN_BOOTSTRAP_KEY: ${CARE_ADMIN_BOOTSTRAP_KEY:-}
      LNC_API_KEYS: ${LNC_API_KEYS:-}
      SESSION_SECRET: ${SESSION_SECRET:?set-session-secret}
      LNC_MASTER_KEY: ${LNC_MASTER_KEY:?set-64-hex-master-key}
      LNC_PREVIOUS_MASTER_KEY: ${LNC_PREVIOUS_MASTER_KEY:-}
      ORGANIZATION_ID: ${ORGANIZATION_ID:?set-organization-id}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://care-mcp.lengoc.me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,10.21.4.101,care-mcp.lengoc.me}
      PROVIDER_WRITES_ENABLED: ${PROVIDER_WRITES_ENABLED:-false}
      PROVIDER_WRITES_META_ENABLED: ${PROVIDER_WRITES_META_ENABLED:-}
      PROVIDER_WRITES_TIKTOK_ENABLED: ${PROVIDER_WRITES_TIKTOK_ENABLED:-}
      PROVIDER_WRITES_YOUTUBE_ENABLED: ${PROVIDER_WRITES_YOUTUBE_ENABLED:-}
      FORWARDED_ALLOW_IPS: "10.21.0.3"
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      # LNC Agent Hub Control Plane, Shared Vault & Unified MCP Gateway (svc:lnc-care)
      LNC_AGENT_HUB_URL: ${LNC_AGENT_HUB_URL:-http://10.21.4.101:8380}
      LNC_AGENT_HUB_PUBLIC_URL: ${LNC_AGENT_HUB_PUBLIC_URL:-}
      LNC_AGENT_HUB_API_KEY: ${LNC_AGENT_HUB_API_KEY:-}
      LNC_MCP_GATEWAY_URL: ${LNC_MCP_GATEWAY_URL:-http://10.21.4.101:8380/mcp}
      # Business MCP Hub Connector Pairing (exposing care__* to Business MCP Hub :8790)
      CONNECTOR_BEARER: ${CONNECTOR_BEARER:-}
      DELEGATION_SECRET: ${DELEGATION_SECRET:-}
      CONNECTOR_AUDIENCE: ${CONNECTOR_AUDIENCE:-lnc-care}
      CONNECTOR_MAX_SCOPES: ${CONNECTOR_MAX_SCOPES:-}
      LNC_CONNECTOR_TOKEN: ${LNC_CONNECTOR_TOKEN:-}
      LNC_DELEGATION_SECRET: ${LNC_DELEGATION_SECRET:-}
      LNC_MCP_AUDIENCE: ${LNC_MCP_AUDIENCE:-lnc-care}
      LNC_MCP_MAX_SCOPES: ${LNC_MCP_MAX_SCOPES:-}
      MCP_REQUIRE_DELEGATION: ${MCP_REQUIRE_DELEGATION:-true}
      # Sibling LAN Bridge & SSO Fallback with LNC Ads (:8480)
      LNC_INTERNAL_BRIDGE_SECRET: ${LNC_INTERNAL_BRIDGE_SECRET:-}
      LNC_INTERNAL_BRIDGE_SELF_ID: ${LNC_INTERNAL_BRIDGE_SELF_ID:-lnc-care}
      LNC_INTERNAL_BRIDGE_PEERS: ${LNC_INTERNAL_BRIDGE_PEERS:-lnc-ads=https://ads-mcp.lengoc.me}
      LNC_INTERNAL_BRIDGE_HOSTS: ${LNC_INTERNAL_BRIDGE_HOSTS:-}
      LNC_ADS_INTERNAL_URL: ${LNC_ADS_INTERNAL_URL:-http://10.21.4.101:8480}
      LNC_ADS_PUBLIC_URL: ${LNC_ADS_PUBLIC_URL:-https://ads-mcp.lengoc.me}
      # Phase 2 / 2b Forensic Archive, Multi-Account Fleet & Cygnus Alerting (optional)
      BROWSER_CAPTURE_URL: ${BROWSER_CAPTURE_URL:-}
      VEILBROWSER_API_URL: ${VEILBROWSER_API_URL:-}
      ORBINE_API_URL: ${ORBINE_API_URL:-}
      MAX_CONCURRENT_BROWSER_SESSIONS: ${MAX_CONCURRENT_BROWSER_SESSIONS:-4}
      CYGNUS_GATEWAY_URL: ${CYGNUS_GATEWAY_URL:-}
      CYGNUS_AUTH_KEY: ${CYGNUS_AUTH_KEY:-}
    volumes:
      - type: bind
        source: ${DATA_DIR:-/home/Docker}/lnc-care
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/app/lnc-care", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lnc-care-worker:
    build: .
    command: ["/app/lnc-care", "worker"]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Paris}
      LNC_MASTER_KEY: ${LNC_MASTER_KEY:?set-64-hex-master-key}
      LNC_PREVIOUS_MASTER_KEY: ${LNC_PREVIOUS_MASTER_KEY:-}
      ORGANIZATION_ID: ${ORGANIZATION_ID:?set-organization-id}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-}
      PROVIDER_WRITES_ENABLED: ${PROVIDER_WRITES_ENABLED:-false}
      LNC_AGENT_HUB_URL: ${LNC_AGENT_HUB_URL:-http://10.21.4.101:8380}
      LNC_AGENT_HUB_API_KEY: ${LNC_AGENT_HUB_API_KEY:-}
      LNC_INTERNAL_BRIDGE_SECRET: ${LNC_INTERNAL_BRIDGE_SECRET:-}
      LNC_INTERNAL_BRIDGE_SELF_ID: ${LNC_INTERNAL_BRIDGE_SELF_ID:-lnc-care}
      LNC_ADS_INTERNAL_URL: ${LNC_ADS_INTERNAL_URL:-http://10.21.4.101:8480}
      BROWSER_CAPTURE_URL: ${BROWSER_CAPTURE_URL:-}
      VEILBROWSER_API_URL: ${VEILBROWSER_API_URL:-}
      ORBINE_API_URL: ${ORBINE_API_URL:-}
      MAX_CONCURRENT_BROWSER_SESSIONS: ${MAX_CONCURRENT_BROWSER_SESSIONS:-4}
      CYGNUS_GATEWAY_URL: ${CYGNUS_GATEWAY_URL:-}
      CYGNUS_AUTH_KEY: ${CYGNUS_AUTH_KEY:-}
    volumes:
      - type: bind
        source: ${DATA_DIR:-/home/Docker}/lnc-care
        target: /data
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
